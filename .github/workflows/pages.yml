name: Publica la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Codi
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependències
        run: npm ci

      - name: Proves
        run: npm test

      - name: Tipus
        run: npx tsc --noEmit

      - name: Exporta la web
        run: npx expo export --platform web
        env:
          GITHUB_PAGES: 'true'
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Enrutament de pàgina única
        run: node tools/prepare-pages.mjs

      - name: Puja l'artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
